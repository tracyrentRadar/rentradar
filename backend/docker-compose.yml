# Local development stack. Start with: docker compose up -d
# Every credential comes from .env (copy .env.example), nothing is hardcoded here.
name: rentradar

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      # Superuser the image creates on first start. The API never uses it.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_APP_DATABASE:?set MONGO_APP_DATABASE in .env}
      # Read by docker/mongo/init/01-create-app-user.js
      MONGO_APP_DATABASE: ${MONGO_APP_DATABASE}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?set MONGO_APP_USERNAME in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env}
    ports:
      # Loopback only, so the database is not exposed to the local network
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The Python inference tier. Built from ../ml, which is where the models, the
  # feature spec and the serving code all live together. Keeping the build
  # context there is deliberate: the service imports the same encode_one that
  # built the training matrix, and splitting them across folders is how training
  # and serving drift apart.
  #
  # No depends_on mongo. This service never touches the database, it holds the
  # models and answers questions about them.
  inference:
    build:
      context: ../ml
      dockerfile: Dockerfile
    image: rentradar-inference:local
    restart: unless-stopped
    ports:
      # Loopback only. The gateway reaches it at http://127.0.0.1:8000, which is
      # what rentradar.ml.base-url already points at, so nothing changes in the
      # Spring configuration.
      - "127.0.0.1:${INFERENCE_PORT:-8000}:8000"

volumes:
  mongo-data: