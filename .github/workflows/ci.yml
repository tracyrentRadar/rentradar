name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly rescan: new advisories are published against dependencies that have
  # not changed, so a green build last month says nothing about today.
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # JaCoCo measures line coverage against the 80 per cent target and
      # reports without failing the build, as Phase 0 specified.
      - name: Build, test and measure coverage
        run: mvn -B -ntp verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn

  dependency-scan:
    name: Dependency scan (fails on CVSS 7.0 or higher)
    # Not on every push. The NVD mirror takes tens of minutes to download, which
    # is useless as per-commit feedback. Weekly and on demand instead.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Requires the NVD_API_KEY repository secret, free from nvd.nist.gov.
      # Without it the scan still runs but the rate limit makes it crawl.
      - name: Scan dependencies against the NVD
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -ntp org.owasp:dependency-check-maven:check

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            backend/target/dependency-check-report.html
            backend/target/dependency-check-report.json
          if-no-files-found: warn